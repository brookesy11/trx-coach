<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>TRX Coach</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Workout">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">
  <div class="topRow">
    <div id="focus" class="focus">Workout</div>
    <div class="barRow">
      <span class="spacer" aria-hidden="true"></span>
      <div class="bar" aria-hidden="true"><div id="barFill"></div></div>
    <button id="playBtn" class="play" type="button" aria-label="Start">
      <svg class="icoPlay" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>
      <svg class="icoPause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1" fill="currentColor"/><rect x="14" y="4.5" width="4.5" height="15" rx="1" fill="currentColor"/></svg>
    </button>
    </div>
  </div>

  <section id="stage" class="stage" aria-live="polite">
    <div id="stageInner" class="stageInner">
      <div id="clock" class="clock" role="button" aria-label="Tap to start or pause">0:30</div>
      <div class="nameRow">
        <h1 id="name" class="name" role="button" tabindex="0" aria-label="Show how to do this exercise">Loading</h1>
      </div>
      <p id="nextLine" class="next"><span>Next</span> <b id="next">-</b></p>
      <button id="plusBtn" class="plus" type="button" hidden>+15s</button>
    </div>
  </section>

  <p id="hint" class="hint" hidden>Swipe &larr; next &middot; &rarr; back &middot; tap timer to pause</p>
  <p id="wake" class="wake" hidden></p>
  <nav id="chips" class="chips" aria-label="Today's exercises"></nav>
</main>

<div id="howto" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="hName">
    <div class="sheetTop">
      <span id="hClock" class="hClock"></span>
      <button id="hClose" class="x" type="button" aria-label="Close">&times;</button>
    </div>
    <h2 id="hName"></h2>
    <p id="hSetup" class="hSetup"></p>
    <ol id="hSteps" class="hSteps"></ol>
    <p class="hRow"><b>Avoid</b><span id="hAvoid"></span></p>
    <p class="hRow"><b>Easier</b><span id="hEasier"></span></p>
    <p class="hRow"><b>Harder</b><span id="hHarder"></span></p>
  </div>
</div>

<section id="finish" class="finish" hidden>
  <div class="finishInner">
    <p class="finishKicker" id="finishFocus">Workout</p>
    <h1 class="finishTitle">Done.</h1>
    <p class="finishStat" id="finishStat"></p>
    <p class="finishStreak" id="finishStreak"></p>
    <p class="finishTomorrow" id="finishTomorrow"></p>
    <button id="againBtn" class="again" type="button">Again</button>
    <p class="finishHint">Swipe &rarr; to go back</p>
  </div>
</section>
