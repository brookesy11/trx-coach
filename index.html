<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>TRX Coach</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Workout">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">
  <div class="topRow">
    <div id="focus" class="focus">Workout</div>
    <div class="barRow">
      <span class="spacer" aria-hidden="true"></span>
      <div class="bar" aria-hidden="true"><div id="barFill"></div></div>
    <button id="playBtn" class="play" type="button" aria-label="Start">
      <svg class="icoPlay" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>
      <svg class="icoPause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1" fill="currentColor"/><rect x="14" y="4.5" width="4.5" height="15" rx="1" fill="currentColor"/></svg>
    </button>
    </div>
  </div>

  <section id="stage" class="stage" aria-live="polite">
    <div id="stageInner" class="stageInner">
      <div id="clock" class="clock" role="button" aria-label="Tap to start or pause">0:30</div>
      <div class="nameRow">
        <h1 id="name" class="name" role="button" tabindex="0" aria-label="Show how to do this exercise">Loading</h1>
      </div>
      <p id="nextLine" class="next"><span>Next</span> <b id="next">-</b></p>
      <button id="plusBtn" class="plus" type="button" hidden>+15s</button>
    </div>
  </section>

  <p id="wake" class="wake" hidden></p>
  <nav id="chips" class="chips" aria-label="Today's exercises"></nav>
</main>

<section id="timerPage" class="timerPage" hidden>
  <div id="tMenu" class="tMenu">
    <div class="tTop"><button id="tBack" class="tIcon" type="button" aria-label="Back">&lsaquo;</button><span class="tTitle">Timer</span><span class="tIconSpacer"></span></div>
    <div class="tGrid" id="tGrid">
      <button class="tPre" data-p="sw">Stopwatch</button>
      <button class="tPre" data-p="intv">Intervals</button>
    </div>
    <div id="tEdit" class="tEdit" hidden>
      <div id="tFields"></div>
      <button id="tGo" class="tGo" type="button">Start</button>
    </div>
  </div>
  <div id="tRun" class="tRun" hidden>
    <div class="tTop"><button id="tStop" class="tIcon" type="button" aria-label="Stop">&times;</button><span id="tRound" class="tRound"></span><span class="tIconSpacer"></span></div>
    <div class="tStage">
      <div id="tState" class="tState">Ready</div>
      <div class="tDial">
        <svg class="tRing" viewBox="0 0 100 100" aria-hidden="true"><circle class="tTrack" cx="50" cy="50" r="48"/><circle id="tArc" class="tArc" cx="50" cy="50" r="48" pathLength="1"/></svg>
        <div id="tTime" class="tTime" role="button" aria-label="Tap to start or pause">0</div>
      </div>
      <div id="tHint" class="tHint"></div>
    </div>
  </div>
</section>

<div id="howto" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="hName">
    <div class="sheetTop">
      <span id="hClock" class="hClock"></span>
      <button id="hClose" class="x" type="button" aria-label="Close">&times;</button>
    </div>
    <h2 id="hName"></h2>
    <p id="hSetup" class="hSetup"></p>
    <ol id="hSteps" class="hSteps"></ol>
    <p class="hRow"><b>Avoid</b><span id="hAvoid"></span></p>
    <p class="hRow"><b>Easier</b><span id="hEasier"></span></p>
    <p class="hRow"><b>Harder</b><span id="hHarder"></span></p>
  </div>
</div>

<section id="finish" class="finish" hidden>
  <div class="finishInner">
    <p class="finishKicker" id="finishFocus">Workout</p>
    <div class="finishTime" id="finishTime">0:00</div>
    <p class="finishStreak" id="finishStreak"></p>
    <div class="rate" id="rate" role="group" aria-label="How hard was it?">
      <button class="rateBtn" type="button" data-r="1" aria-label="Easy"><span class="rateIco">😎</span><span class="rateLbl">Easy</span></button>
      <button class="rateBtn" type="button" data-r="2" aria-label="Solid"><span class="rateIco">😤</span><span class="rateLbl">Solid</span></button>
      <button class="rateBtn" type="button" data-r="3" aria-label="Brutal"><span class="rateIco">💀</span><span class="rateLbl">Brutal</span></button>
    </div>
    <div class="tmr">
      <p class="tmrHead" id="tmrHead">Tomorrow</p>
      <ol class="tmrList" id="tmrList"></ol>
    </div>
    <button id="saveBtn" class="saveBtn" type="button" hidden>Save</button>
    <button id="againBtn" class="again" type="button">Again</button>
  </div>
  <button id="timerCue" class="timerCue" type="button" aria-label="Open timer">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 13.5V9.5M9.5 3h5M12 3v3M18.2 6.8l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    <span aria-hidden="true">&rsaquo;</span>
  </button>
</section>
